name: 全自动云端打包 (Android APK & Windows EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 构建 Android 原生 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 编译前端静态资源
        run: |
          cd algo-quiz-app
          npm install
          npm run build

      - name: Capacitor 转换为 Android 项目
        run: |
          cd algo-quiz-app
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Gradle 编译 Android APK
        run: |
          cd algo-quiz-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 Android APK 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 算法岗刷题-Android-Debug.apk
          path: algo-quiz-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布 Release 并提供直链下载
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: release-v1.0.0
          name: 算法岗笔试面试刷题客户端 (全端产物)
          files: |
            algo-quiz-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
